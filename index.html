<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PidiLang: Live Playground</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'official-bg': '#0A0A0A',
                        'official-accent': '#3B82F6',
                        'official-card': '#111827',
                        'official-code': '#1F2937',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0A0A0A; color: #FAFAFA; font-family: sans-serif; }
        #output { background-color: #000; color: #22c55e; font-family: monospace; padding: 15px; min-height: 120px; border: 1px solid #333; white-space: pre-wrap; font-size: 1.1rem; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-4xl mx-auto">
        <header class="text-center py-6">
            <h1 class="text-5xl font-extrabold text-white tracking-tighter">PidiLang</h1>
            <p id="loading-msg" class="text-orange-500 font-mono text-sm animate-pulse mt-2">Warming up... wait small...</p>
        </header>

        <section class="bg-official-card p-4 rounded-lg border border-gray-800 shadow-xl">
            <textarea id="user-code" class="w-full h-48 bg-official-code text-white p-4 font-mono rounded mb-4 focus:ring-2 focus:ring-blue-500 outline-none border border-gray-700" spellcheck="false">DAT_ME x = 2
DAT_ME y = 2
DAT_ME result = x JOIN_AM y
TALK_AM result
FINISH</textarea>
            
            <button py-click="run_pidi" id="run-btn" class="w-full bg-official-accent hover:bg-blue-600 text-white font-bold py-4 rounded transition active:scale-95">RUN_AM</button>
            
            <div class="mt-6">
                <div class="flex justify-between text-xs text-gray-500 mb-2 font-mono uppercase tracking-widest">
                    <span>Terminal Output</span>
                </div>
                <div id="output">Console ready. Write code and click RUN_AM.</div>
            </div>
        </section>

        <script type="py">
import re
from pyscript import document

# This signal tells you the engine is 100% loaded
document.querySelector("#loading-msg").innerText = "PidiEngine Ready ✅"
document.querySelector("#loading-msg").classList.remove("animate-pulse")
document.querySelector("#loading-msg").classList.add("text-green-500")

def run_pidi(event):
    # 1. Clear previous output immediately to show it's working
    out_box = document.querySelector("#output")
    out_box.innerText = "Processing...\n"
    
    # 2. Get the code
    code_input = document.querySelector("#user-code").value
    
    memory = {}
    running = True
    
    # Big 60 Keywords List
    keywords = ['E_BE_SAME', 'ADD_AM', 'JOIN_AM', 'MINUS_AM', 'TIMES_AM', 'SHARE_AM', 'SUPPOSE', 'SOTEY', 'DAT_ME', 'TALK_AM', 'ASK_AM', 'FINISH', 'NO_BE_SAME', 'PASS_AM', 'UNDER_AM', 'WAKA_ROUND', 'CHOP_AM', 'GET_OUT', 'LISTEN_AM', 'FIX_AM', 'TEST_AM', 'NA_SO', 'NO_BE_SO', 'MUMU_ERROR', 'SENSE_AM', 'NETWORK_AM', 'KPA_AM', 'BOLA_AM', 'TIGHT_AM', 'LOOSE_AM', 'WETIN_BE', 'WHO_BE', 'HOW_FAR', 'DIVE_IN', 'JUMP_OUT', 'SHARP_SHARP', 'SOFT_SOFT', 'KOLO_AM', 'CHILL_AM', 'VEX_AM', 'JOY_AM', 'LOAD_AM', 'SEND_AM', 'CATCH_AM', 'THROW_AM', 'TRY_YOUR_BEST', 'IF_E_BAD', 'ALWAYS_DO', 'STANDBY', 'SHUTDOWN', 'RESTART', 'OBEY_AM', 'DISOBEY_AM', 'SABI_AM', 'FORGET_AM', 'GIVE_AM', 'TAKE_AM', 'DOUBT_AM', 'TRUST_AM', 'CHECK_AM', 'WAIT_AM', 'GO_SLOW', 'RUN_FAST', 'LEVEL_UP', 'GROUND_AM', 'SKY_AM', 'FIRE_AM', 'WATER_AM', 'BREEZE_AM']
    
    # Updated pattern to capture everything properly
    pattern = r'("[^"]*"|[a-zA-Z_]\w*|\d+|\+|\-|\*|\/|\=|\(|\))'
    tokens = re.findall(pattern, code_input)

    i = 0
    while i < len(tokens) and running:
        token = tokens[i]
        
        if token == 'DAT_ME':
            var_name = tokens[i+1]
            if tokens[i+2] == '=':
                # Check for Math Algorithms
                if i + 5 < len(tokens) and tokens[i+4] in ['JOIN_AM', 'ADD_AM', 'MINUS_AM', 'TIMES_AM', 'SHARE_AM']:
                    v1 = int(memory.get(tokens[i+3], tokens[i+3]))
                    v2 = int(memory.get(tokens[i+5], tokens[i+5]))
                    op = tokens[i+4]
                    if op == 'JOIN_AM' or op == 'ADD_AM': memory[var_name] = v1 + v2
                    elif op == 'MINUS_AM': memory[var_name] = v1 - v2
                    elif op == 'TIMES_AM': memory[var_name] = v1 * v2
                    elif op == 'SHARE_AM': memory[var_name] = v1 // v2
                    i += 6
                else:
                    val = tokens[i+3]
                    memory[var_name] = val.replace('"', '') if val.startswith('"') else int(val)
                    i += 4
            continue

        elif token == 'TALK_AM':
            target = tokens[i+1]
            val = memory.get(target, target)
            # Send to the actual screen div
            out_box.innerText += str(val).replace('"', '') + "\n"
            i += 2
            continue

        elif token == 'FINISH':
            running = False
            break
        
        # Check for Invalid Lexicon
        elif token not in keywords and token not in memory and not token.isdigit() and not token.startswith('"') and token not in ['=', '(', ')']:
            out_box.innerText += f"ERROR: Invalid lexicon '{token}' detected.\n"
            i += 1
            continue
            
        else:
            i += 1
        </script>

        <footer class="text-center py-10 text-gray-600 text-xs">
            &copy; 2026 PidiLang Project. v1.2.1
        </footer>
    </div>
</body>
</html>
