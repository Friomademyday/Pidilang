<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PidiLang: Official v1.5.0 Specification</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pidi-gold': '#FACC15',
                        'pidi-dark': '#050505',
                        'pidi-card': '#0F172A',
                        'pidi-accent': '#3B82F6',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Fira+Code:wght@400;500&display=swap');
        body { background-color: #050505; color: #E2E8F0; font-family: 'Space+Grotesk', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        #output { background-color: #000; color: #FACC15; font-family: 'Fira Code', monospace; padding: 20px; min-height: 150px; border: 1px solid #FACC15; white-space: pre-wrap; border-radius: 8px; box-shadow: inset 0 0 10px #facc1533; }
        .lexicon-scroll { max-height: 600px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #FACC15 #0F172A; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="text-center py-12">
            <h1 class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pidi-gold to-pidi-accent tracking-tighter mb-4">PidiLang</h1>
            <div id="loading-msg" class="inline-block px-4 py-1 rounded-full border border-orange-500 text-orange-500 text-xs font-bold uppercase tracking-widest animate-pulse">Initializing PidiEngine Runtime...</div>
        </header>

        <div class="grid lg:grid-cols-2 gap-8">
            
            <div class="glass p-8 rounded-3xl shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-pidi-gold">Live Playground</h2>
                    <span class="text-xs font-mono text-gray-500">v1.5.0-STRICT</span>
                </div>
                <textarea id="user-code" class="w-full h-80 bg-black/50 text-white p-6 font-mono rounded-xl mb-6 focus:ring-2 focus:ring-pidi-gold outline-none border border-gray-800 text-lg shadow-inner" spellcheck="false">DAT_ME name = "PidiUser"
DAT_ME score = 100
DAT_ME bonus = 50
DAT_ME final = score JOIN_AM bonus
TALK_AM "Welcome:"
TALK_AM name
TALK_AM "Final Score:"
TALK_AM final
FINISH</textarea>
                <button py-click="run_pidi" class="w-full bg-pidi-gold hover:bg-white text-black font-black py-5 rounded-xl transition duration-300 transform active:scale-95 shadow-lg shadow-pidi-gold/20 uppercase tracking-widest">Execute Script (RUN_AM)</button>
                <div class="mt-8">
                    <h3 class="text-xs font-bold text-gray-500 mb-3 uppercase tracking-widest">System Output</h3>
                    <div id="output">Waiting for instructions...</div>
                </div>
            </div>

            <div class="glass p-8 rounded-3xl shadow-2xl">
                <h2 class="text-2xl font-bold text-pidi-accent mb-6">The Big 60 Manual</h2>
                <div class="lexicon-scroll pr-4">
                    <table class="w-full text-left">
                        <thead class="sticky top-0 bg-pidi-card text-pidi-gold text-xs uppercase tracking-widest">
                            <tr>
                                <th class="p-4">Lexicon</th>
                                <th class="p-4">Usage</th>
                                <th class="p-4">Meaning</th>
                            </tr>
                        </thead>
                        <tbody id="lexicon-table-body" class="divide-y divide-gray-800">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script type="py">
import re
from pyscript import document

# UI Ready State
document.querySelector("#loading-msg").innerText = "PidiEngine Ready ✅"
document.querySelector("#loading-msg").classList.remove("border-orange-500", "text-orange-500", "animate-pulse")
document.querySelector("#loading-msg").classList.add("border-pidi-gold", "text-pidi-gold")

# The Big 60 Database
big_60 = [
    ("DAT_ME", "DAT_ME x = 5", "Create a variable"),
    ("TALK_AM", "TALK_AM x", "Print to screen"),
    ("ASK_AM", "ASK_AM 'Name?'", "Get user input"),
    ("JOIN_AM", "x JOIN_AM y", "Add (+)"),
    ("MINUS_AM", "x MINUS_AM y", "Subtract (-)"),
    ("TIMES_AM", "x TIMES_AM y", "Multiply (*)"),
    ("SHARE_AM", "x SHARE_AM y", "Divide (/)"),
    ("SUPPOSE", "SUPPOSE x == 5", "If condition"),
    ("E_BE_SAME", "x E_BE_SAME y", "Equality (==)"),
    ("NO_BE_SAME", "x NO_BE_SAME y", "Not equal (!=)"),
    ("PASS_AM", "x PASS_AM y", "Greater than (>)"),
    ("UNDER_AM", "x UNDER_AM y", "Less than (<)"),
    ("SOTEY", "SOTEY (x < 10)", "While loop"),
    ("WAKA_ROUND", "WAKA_ROUND list", "For each loop"),
    ("FINISH", "FINISH", "End program"),
    ("SENSE_AM", "SENSE_AM x", "AI Analysis"),
    ("KOLO_AM", "KOLO_AM x", "Random logic"),
    ("TRY_YOUR_BEST", "TRY_YOUR_BEST", "Try block"),
    ("IF_E_BAD", "IF_E_BAD", "Catch error"),
    ("MUMU_ERROR", "MUMU_ERROR", "System crash"),
    ("CHOP_AM", "CHOP_AM x", "Consume data"),
    ("GET_OUT", "GET_OUT", "Exit loop"),
    ("LISTEN_AM", "LISTEN_AM", "Event listener"),
    ("FIX_AM", "FIX_AM x", "Debug variable"),
    ("TEST_AM", "TEST_AM x", "Unit test"),
    ("NA_SO", "NA_SO", "Boolean TRUE"),
    ("NO_BE_SO", "NO_BE_SO", "Boolean FALSE"),
    ("NETWORK_AM", "NETWORK_AM", "Connect online"),
    ("KPA_AM", "KPA_AM", "Clear memory"),
    ("BOLA_AM", "BOLA_AM", "Trash collection"),
    ("TIGHT_AM", "TIGHT_AM x", "Compress"),
    ("LOOSE_AM", "LOOSE_AM x", "Decompress"),
    ("WETIN_BE", "WETIN_BE x", "Get type"),
    ("WHO_BE", "WHO_BE x", "Get identity"),
    ("HOW_FAR", "HOW_FAR", "System status"),
    ("DIVE_IN", "DIVE_IN", "Open function"),
    ("JUMP_OUT", "JUMP_OUT", "Return value"),
    ("SHARP_SHARP", "SHARP_SHARP", "Fast execution"),
    ("SOFT_SOFT", "SOFT_SOFT", "Low power mode"),
    ("CHILL_AM", "CHILL_AM 100", "Sleep/Pause"),
    ("VEX_AM", "VEX_AM", "Raise exception"),
    ("JOY_AM", "JOY_AM", "Success signal"),
    ("LOAD_AM", "LOAD_AM 'pkg'", "Import module"),
    ("SEND_AM", "SEND_AM x", "Export / Push"),
    ("CATCH_AM", "CATCH_AM x", "Pull / Receive"),
    ("THROW_AM", "THROW_AM x", "Throw error"),
    ("ALWAYS_DO", "ALWAYS_DO", "Finally block"),
    ("STANDBY", "STANDBY", "Wait state"),
    ("SHUTDOWN", "SHUTDOWN", "Kill process"),
    ("RESTART", "RESTART", "Reset engine"),
    ("OBEY_AM", "OBEY_AM x", "Force execute"),
    ("DISOBEY_AM", "DISOBEY_AM x", "Ignore logic"),
    ("SABI_AM", "SABI_AM x", "Knowledge base"),
    ("FORGET_AM", "FORGET_AM x", "Delete var"),
    ("GIVE_AM", "GIVE_AM x", "Pass argument"),
    ("TAKE_AM", "TAKE_AM x", "Receive param"),
    ("DOUBT_AM", "DOUBT_AM x", "Verify data"),
    ("TRUST_AM", "TRUST_AM x", "Trust data"),
    ("CHECK_AM", "CHECK_AM x", "Audit log"),
    ("WAIT_AM", "WAIT_AM", "Await async"),
    ("GO_SLOW", "GO_SLOW", "Throttle"),
    ("RUN_FAST", "RUN_FAST", "Optimize"),
    ("LEVEL_UP", "LEVEL_UP", "Upgrade engine"),
    ("GROUND_AM", "GROUND_AM", "Local scope"),
    ("SKY_AM", "SKY_AM", "Global scope"),
    ("FIRE_AM", "FIRE_AM", "Execute now"),
    ("WATER_AM", "WATER_AM", "Clean logs"),
    ("BREEZE_AM", "BREEZE_AM", "Lightweight")
]

# Populate the table in the UI
table_body = document.querySelector("#lexicon-table-body")
for lex, use, mean in big_60:
    row = f"<tr class='hover:bg-white/5 transition'><td class='p-4 font-mono text-pidi-gold'>{lex}</td><td class='p-4 font-mono text-xs text-gray-400'>{use}</td><td class='p-4 text-xs italic'>{mean}</td></tr>"
    table_body.innerHTML += row

def run_pidi(event):
    out_box = document.querySelector("#output")
    out_box.innerText = ""
    code_input = document.querySelector("#user-code").value
    
    memory = {}
    running = True
    keywords = [x[0] for x in big_60]
    
    pattern = r'("[^"]*"|[a-zA-Z_]\w*|\d+|\+|\-|\*|\/|\=|\(|\))'
    tokens = re.findall(pattern, code_input)

    i = 0
    while i < len(tokens) and running:
        token = tokens[i]
        
        if token == 'DAT_ME':
            try:
                var_name = tokens[i+1]
                if tokens[i+2] == '=':
                    if i + 5 < len(tokens) and tokens[i+4] in ['JOIN_AM', 'MINUS_AM', 'TIMES_AM', 'SHARE_AM']:
                        v1 = memory.get(tokens[i+3])
                        v2 = memory.get(tokens[i+5])
                        
                        if v1 is None: v1 = int(tokens[i+3]) if tokens[i+3].isdigit() else 0
                        if v2 is None: v2 = int(tokens[i+5]) if tokens[i+5].isdigit() else 0
                        
                        op = tokens[i+4]
                        if op == 'JOIN_AM': memory[var_name] = v1 + v2
                        elif op == 'MINUS_AM': memory[var_name] = v1 - v2
                        elif op == 'TIMES_AM': memory[var_name] = v1 * v2
                        elif op == 'SHARE_AM': memory[var_name] = v1 // v2
                        i += 6
                    else:
                        val = tokens[i+3]
                        if val.startswith('"'):
                            memory[var_name] = val.replace('"', '')
                        elif val.isdigit():
                            memory[var_name] = int(val)
                        else:
                            # Handle variable assignment from another variable
                            if val in memory:
                                memory[var_name] = memory[val]
                            else:
                                out_box.innerText += f"ERROR: '{val}' no dey memory.\n"
                        i += 4
                continue
            except Exception:
                out_box.innerText += "MUMU_ERROR: Assignment spoil!\n"
                break

        elif token == 'TALK_AM':
            try:
                target = tokens[i+1]
                if target.startswith('"'):
                    out_box.innerText += target.replace('"', '') + "\n"
                elif target in memory:
                    out_box.innerText += str(memory[target]) + "\n"
                else:
                    out_box.innerText += f"ERROR: I no sabi wetin be '{target}'.\n"
                i += 2
                continue
            except: break

        elif token == 'FINISH':
            running = False
            break
        
        elif token in keywords or token in memory or token.isdigit() or token.startswith('"') or token in ['=', '(', ')']:
            i += 1
            continue
            
        else:
            out_box.innerText += f"INVALID_LEXICON: '{token}' no dey the Big 60.\n"
            i += 1
        </script>

        <footer class="text-center py-20 text-gray-700 text-xs tracking-widest font-bold uppercase">
            Designed for the streets, built for the stars. &copy; 2026 PidiLang.
        </footer>
    </div>
</body>
    </html>
