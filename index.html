<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PidiLang: Official Language Specification</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'official-bg': '#0A0A0A',
                        'official-text': '#FAFAFA',
                        'official-accent': '#3B82F6',
                        'official-card': '#111827',
                        'official-code': '#1F2937',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { background-color: #0A0A0A; color: #FAFAFA; font-family: 'Inter', sans-serif; }
        .playground-box { background-color: #111827; border: 2px solid #3B82F6; border-radius: 8px; }
        #output { background-color: #000; color: #22c55e; font-family: monospace; padding: 10px; min-height: 100px; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-12">

    <div class="max-w-5xl mx-auto">
        <header class="text-center py-10 mb-12 border-b-2 border-official-card">
            <h1 class="text-7xl font-extrabold text-white tracking-tighter">PidiLang</h1>
            <p class="text-2xl text-official-accent mt-3 font-medium">The Official Language Specification</p>
        </header>

        <section class="mb-12">
            <h2 class="text-3xl font-bold mb-6">Pidi Playground (Try it Live)</h2>
            <div class="playground-box p-6">
                <textarea id="user-code" class="w-full h-48 bg-official-code text-white p-4 font-mono rounded mb-4 focus:outline-none border border-gray-700" placeholder="Write PidiLang here...">DAT_ME name = "Friend"
TALK_AM "How far,"
TALK_AM name
FINISH</textarea>
                <button py-click="run_pidi" class="bg-official-accent hover:bg-blue-600 text-white font-bold py-2 px-6 rounded transition">RUN_AM</button>
                
                <div class="mt-6">
                    <p class="text-sm text-gray-400 mb-2 font-mono uppercase">Console Output:</p>
                    <div id="output"></div>
                </div>
            </div>
        </section>

        <script type="py">
            import re
            from pyscript import document

            def run_pidi(event):
                code = document.querySelector("#user-code").value
                output_div = document.querySelector("#output")
                output_div.innerText = ""
                
                memory = {}
                running = True
                
                pattern = r'("[^"]*"|[a-zA-Z_]\w*|\d+|\+|\-|\*|\/|\=|\(|\)|E_BE_SAME|JOIN_AM|MINUS_AM|TIMES_AM|SHARE_AM|SUPPOSE|SOTEY|DAT_ME|TALK_AM|ASK_AM|FINISH|NO_BE_SAME|PASS_AM|UNDER_AM)'
                tokens = re.findall(pattern, code)

                i = 0
                while i < len(tokens) and running:
                    token = tokens[i]
                    if token == 'DAT_ME':
                        var_name = tokens[i+1]
                        val = tokens[i+3]
                        memory[var_name] = val.replace('"', '') if val.startswith('"') else int(val)
                        i += 4
                    elif token == 'TALK_AM':
                        target = tokens[i+1]
                        result = memory.get(target, target.replace('"', ''))
                        output_div.innerText += str(result) + "\n"
                        i += 2
                    elif token == 'FINISH':
                        running = False
                        break
                    else:
                        i += 1
        </script>

        <footer class="text-center pt-8 mt-12 border-t border-official-code">
            <p class="text-gray-500 text-sm">&copy; 2026 PidiLang Project. v1.1.0</p>
        </footer>
    </div>
</body>
</html>
